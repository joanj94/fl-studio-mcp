[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-studio-mcp"
version = "0.1.0"
description = "MCP server for controlling FL Studio - mixer, transport, channels, plugins, and piano roll"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Karlo" }
]
keywords = ["mcp", "fl-studio", "midi", "daw", "music-production", "piano-roll"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "fastmcp>=2.0",
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "pynput>=1.7",
]

[project.optional-dependencies]
# Audio measurements for fl_render / audio_analyze.
analysis = [
    "numpy>=1.26",
]
# Stem separation (audio_separate_stems, Demucs). "stems" takes torch from PyPI: CPU
# only on Windows and macOS. "stems-gpu" takes it from PyTorch's CUDA 12.6 index
# (NVIDIA cards from the GTX 900 series on). Choose one of the two.
stems = [
    "numpy>=1.26",
    "demucs>=4.1",
    # Demucs keeps torch below 2.3 on Intel Macs only; without this the lock took
    # 2.2.2 everywhere.
    "torch>=2.5; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
stems-gpu = [
    "numpy>=1.26",
    "demucs>=4.1",
    "torch>=2.1",
]
dev = [
    "fl-studio-api-stubs>=37.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
fl-studio-mcp = "fl_studio_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]

[tool.uv]
# cryptography >=49 ships macOS wheels for arm64 only; on Intel Macs it falls
# back to a source build (needs Rust + OpenSSL). 48.x still has universal2
# wheels and satisfies joserfc's cryptography>=45.0.1 requirement.
constraint-dependencies = ["cryptography<49"]
conflicts = [[{ extra = "stems" }, { extra = "stems-gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", extra = "stems-gpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "fl-studio-api-stubs>=37.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/fl_studio_mcp", "fl_controller"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
